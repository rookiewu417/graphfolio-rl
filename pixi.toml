[workspace]
name = "graphfolio-rl"
version = "0.1.0"
description = "Multi-view Graph Neural Network + PPO for A-Share Portfolio Optimization"
authors = ["Tipsy <Tipsy.050417@outlook.com>"]
channels = ["conda-forge", "nvidia"]
platforms = ["win-64"]

[system-requirements]
cuda = "12.4"

[dependencies]
python = ">=3.12,<3.13"
# PyTorch Windows DLL dependencies
llvm-openmp = ">=15"
# Scientific stack
numpy = ">=1.24"
pyarrow = ">=15.0"
pandas = ">=2.0"
scikit-learn = ">=1.4"
scipy = ">=1.11"
# Visualization
matplotlib = ">=3.8"
seaborn = ">=0.13"
plotly = ">=5.18"
# Dev / notebook
jupyterlab = ">=4.0"
ipywidgets = "*"
# Utilities
pyyaml = ">=6.0"
tqdm = ">=4.66"
python-dotenv = ">=1.0"
rich = ">=13.0"

[pypi-options]
# CUDA 12.4 PyTorch wheels + PyG wheels for RTX 4070 Laptop
extra-index-urls = ["https://download.pytorch.org/whl/cu124"]
find-links = [{ url = "https://data.pyg.org/whl/torch-2.4.0+cu124.html" }]

[pypi-dependencies]
# PyTorch CUDA 12.4
torch = ">=2.4,<2.5"
torchvision = ">=0.19,<0.20"
# PyTorch Geometric + sparse ops
torch-geometric = ">=2.5"
torch-scatter = "*"
torch-sparse = "*"
torch-cluster = "*"
# Financial data
akshare = ">=1.12"
tushare = ">=1.4"
# Technical indicators
ta = ">=0.11"
# RL
stable-baselines3 = { version = ">=2.2", extras = ["extra"] }
gymnasium = ">=0.29"
shimmy = ">=1.3"
# Portfolio analysis
quantstats = ">=0.0.62"
# Experiment tracking
wandb = ">=0.16"
# Config & utilities
hydra-core = ">=1.3"
omegaconf = ">=2.3"

[feature.dev.activation.env]
KMP_DUPLICATE_LIB_OK = "TRUE"

[feature.dev.dependencies]
pytest = ">=7.4"
pytest-cov = "*"
black = ">=23.0"
ruff = ">=0.1"
mypy = "*"
ipython = "*"

[environments]
default = { solve-group = "default" }
dev = { features = ["dev"], solve-group = "default" }

[activation.env]
KMP_DUPLICATE_LIB_OK = "TRUE"

[tasks]
# Data pipeline
download-data = { cmd = "python -m src.data.downloader", description = "Download A-share stock data via tushare/akshare" }
build-graphs = { cmd = "python -m src.graphs.multi_view", description = "Build industry + correlation graphs" }

# Training
train = { cmd = "python -m src.agents.ppo_train --config configs/default.yaml", description = "Train GNN-PPO agent", env = { KMP_DUPLICATE_LIB_OK = "TRUE" } }
train-ablation = { cmd = "python -m src.agents.ppo_train --config configs/ablation.yaml", description = "Run ablation experiments", env = { KMP_DUPLICATE_LIB_OK = "TRUE" } }

# Evaluation
backtest = { cmd = "python -m src.eval.backtest --config configs/default.yaml", description = "Run full backtest" }
baselines = { cmd = "python -m src.eval.baselines", description = "Compute all baseline strategies" }
visualize = { cmd = "python src/eval/visualize.py", description = "Generate all result figures → results/figures/", env = { KMP_DUPLICATE_LIB_OK = "TRUE" } }

# Testing
test = { cmd = "pytest tests/ -v --cov=src", description = "Run unit tests" }
run-all = { cmd = "python run_experiments.py", description = "Run full experiment pipeline: baselines + W3 + W4-W5 + eval" }
lint = { cmd = "ruff check src/ && black --check src/", description = "Lint and format check" }
