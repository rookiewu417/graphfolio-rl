[project]
name = "graphfolio-rl"
version = "0.1.0"
description = "Multi-view Graph Neural Network + PPO for A-Share Portfolio Optimization"
authors = ["Tipsy <Tipsy.050417@outlook.com>"]
channels = ["conda-forge", "pytorch", "nvidia", "pyg"]
platforms = ["win-64"]

[dependencies]
python = ">=3.10,<3.12"
# PyTorch with CUDA 12.4 (RTX 4070 Laptop)
pytorch = { version = ">=2.2", channel = "pytorch" }
pytorch-cuda = { version = "12.4.*", channel = "pytorch" }
torchvision = { channel = "pytorch" }
# PyTorch Geometric via pyg channel
pyg = { channel = "pyg" }
# Scientific stack
numpy = ">=1.24"
pandas = ">=2.0"
scikit-learn = ">=1.4"
scipy = ">=1.11"
# Visualization
matplotlib = ">=3.8"
seaborn = ">=0.13"
plotly = ">=5.18"
# Dev / notebook
jupyterlab = ">=4.0"
ipywidgets = "*"
# Utilities
pyyaml = ">=6.0"
tqdm = ">=4.66"
python-dotenv = ">=1.0"
rich = ">=13.0"

[pypi-dependencies]
# Financial data
akshare = ">=1.12"
tushare = ">=1.4"
# Technical indicators
pandas-ta = ">=0.3"
# RL framework (FinRL + SB3)
finrl = ">=0.3"
stable-baselines3 = { version = ">=2.2", extras = ["extra"] }
gymnasium = ">=0.29"
shimmy = ">=1.3"
# Portfolio analysis
quantstats = ">=0.0.62"
pyfolio-reloaded = ">=0.9"
empyrical = ">=0.5"
# Experiment tracking
wandb = ">=0.16"
# Config & utilities
hydra-core = ">=1.3"
omegaconf = ">=2.3"

[feature.dev.dependencies]
pytest = ">=7.4"
pytest-cov = "*"
black = ">=23.0"
ruff = ">=0.1"
mypy = "*"
ipython = "*"

[environments]
default = { solve-group = "default" }
dev = { features = ["dev"], solve-group = "default" }

[tasks]
# Data pipeline
download-data = { cmd = "python -m src.data.downloader", description = "Download A-share stock data via tushare/akshare" }
build-graphs = { cmd = "python -m src.graphs.multi_view", description = "Build industry + correlation graphs" }

# Training
train = { cmd = "python -m src.agents.ppo_train --config configs/default.yaml", description = "Train GNN-PPO agent" }
train-ablation = { cmd = "python -m src.agents.ppo_train --config configs/ablation.yaml", description = "Run ablation experiments" }

# Evaluation
backtest = { cmd = "python -m src.eval.backtest --config configs/default.yaml", description = "Run full backtest" }
baselines = { cmd = "python -m src.eval.baselines", description = "Compute all baseline strategies" }

# Testing
test = { cmd = "pytest tests/ -v --cov=src", description = "Run unit tests" }
lint = { cmd = "ruff check src/ && black --check src/", description = "Lint and format check" }
